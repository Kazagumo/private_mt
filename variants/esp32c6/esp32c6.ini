[esp32c6_base]
extends = esp32_base
platform =
  # Do not renovate until we have switched to pioarduino tagged builds
  ;https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
  https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
  ;https://github.com/Jason2866/platform-espressif32/archive/refs/heads/Arduino/IDF53.zip
  ;https://github.com/Jason2866/platform-espressif32/archive/22faa566df8c789000f8136cd8d0aca49617af55.zip
build_unflags = -fno-lto
build_flags =
  ${arduino_base.build_flags}
  -flto
  -O2
  -Wall
  -Wextra
  -Wno-overloaded-virtual
  -Wno-unused-variable
  -Isrc/platform/esp32
  -std=c++11
  -DESP32C6
  -DESP_OPENSSL_SUPPRESS_LEGACY_WARNING
  -DSERIAL_BUFFER_SIZE=4096
  -DLIBPAX_ARDUINO
  -DLIBPAX_WIFI
  -DLIBPAX_BLE
  ;-DMESHTASTIC_EXCLUDE_WEBSERVER
  ;-DDEBUG_HEAP
  ; TEMP
  ;-DMESHTASTIC_EXCLUDE_PAXCOUNTER
  ;-DMESHTASTIC_EXCLUDE_BLUETOOTH

lib_deps =
  ${arduino_base.lib_deps}
  ${networking_base.lib_deps}
  ${environmental_base.lib_deps}
  ${radiolib_base.lib_deps}
  # renovate: datasource=git-refs depName=libpax packageName=https://github.com/mverch67/libpax gitBranch=master
  https://github.com/mverch67/libpax/archive/6f52ee989301cdabaeef00bcbf93bff55708ce2f.zip
  # renovate: datasource=custom.pio depName=XPowersLib packageName=lewisxhe/library/XPowersLib
  lewisxhe/XPowersLib@0.3.2
  # renovate: datasource=git-refs depName=meshtastic-ESP32_Codec2 packageName=https://github.com/meshtastic/ESP32_Codec2 gitBranch=master
  https://github.com/meshtastic/ESP32_Codec2/archive/633326c78ac251c059ab3a8c430fcdf25b41672f.zip
  # renovate: datasource=custom.pio depName=rweather/Crypto packageName=rweather/library/Crypto
  rweather/Crypto@0.4.0
  # renovate: datasource=github-tags depName=esp-nimble-cpp packageName=h2zero/esp-nimble-cpp
  h2zero/NimBLE-Arduino@^2.3.6
  https://github.com/Kazagumo/NonBlockingRTTTL-idf5.1/archive/refs/tags/1.5.zip
  https://github.com/meshtastic/esp32_https_server/archive/3223704846752e6d545139204837bdb2a55459ca.zip
  https://github.com/Kazagumo/arduino-lua/archive/refs/heads/main.zip
  https://github.com/holgerlembke/ESPFMfGK/archive/refs/tags/v2.0.17.zip

build_src_filter = 
 ${esp32_base.build_src_filter} 

monitor_speed = 460800
monitor_filters = esp32_c3_exception_decoder

lib_ignore =
  NonBlockingRTTTL
  ;NimBLE-Arduino
  ${environmental_extra.lib_deps}
  libpax
  Syslog
  

[env:esp32c6-super-mini]
extends = esp32c6_base
board = esp32-c6-devkitm-1
framework = arduino
board_level = pr
build_flags = 
  ${esp32c6_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32c6/diy/esp32c6_super_mini
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -L "${platformio.libdeps_dir}/${this.__env__}/bsec2/src/esp32c3"
  -D HAS_BLUETOOTH=1

board_build.partitions = variants/esp32c6/usugumo_c6/partition-table-4M.csv
[env:usugumo-c6]
extends = esp32c6_base
board = usugumo_c6
framework = arduino
board_level = pr
build_flags = 
  ${esp32c6_base.build_flags}
  -D PRIVATE_HW
  -D NIMBLE_TWO
  -I variants/esp32c6/usugumo_c6
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCONFIG_BT_NIMBLE_EXT_ADV=1
	-DCONFIG_BT_NIMBLE_MAX_EXT_ADV_INSTANCES=2
  -D HAS_BLUETOOTH=1

board_build.partitions = variants/esp32c6/usugumo_c6/partition-table-4M.csv

[env:usugumo-c6-8m]
extends = esp32c6_base
board = usugumo_c6

debug_init_break = break setup

framework = arduino
board_level = pr
build_flags = 
  ${esp32c6_base.build_flags}
  -D PRIVATE_HW
  -D NIMBLE_TWO
  -D DEBUG_MUTE
  -D MESSAGE_HISTORY_LIMIT=50
  -I variants/esp32c6/usugumo_c6
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCONFIG_BT_NIMBLE_EXT_ADV=1
	-DCONFIG_BT_NIMBLE_MAX_EXT_ADV_INSTANCES=2
  -D HAS_BLUETOOTH=1

board_build.partitions = variants/esp32c6/usugumo_c6/partition-table-8M.csv
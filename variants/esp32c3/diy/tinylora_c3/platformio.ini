;TinyLora-C3, https://github.com/Mymetu/TinyLora-C3
[env:tinylora_c3]
extends = esp32c3_base
board = esp32-c3-devkitm-1
build_flags =
  ${esp32_base.build_flags}
  -D PRIVATE_HW
  -D TINYLORA
  -I variants/esp32c3/diy/tinylora_c3
  -D EXCLUDE_PY
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
board_level = extra

board_build.partitions = variants/esp32c3/diy/tinylora_c3/partition-table-4M.csv

;TinyLora-C3, https://github.com/Mymetu/TinyLora-C3
[env:tinylora_c3_8m_gps]
extends = esp32c3_base
board = tinylora
build_flags =
  ${esp32_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32c3/diy/tinylora_c3
  -D TINYLORA
  -D DEBUG_MUTE
  -D TL_GPS
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
board_level = extra

board_build.partitions = variants/esp32c3/diy/tinylora_c3/partition-table-8M.csv

